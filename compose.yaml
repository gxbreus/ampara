# Ampara: sistema completo com um comando.
#
#   cp .env.example .env
#   ./scripts/gerar-chaves-jwt.sh      # par RS256 do JWT
#   # preencha as senhas no .env
#   docker compose up -d --build
#
# Esta é a base (#37): bancos, broker, redes e volumes. Cada dono acrescenta o bloco do
# próprio serviço (#38 a #45) seguindo este modelo:
#
#   animais:
#     build: ./services/animais
#     image: ampara/animais:dev
#     environment:                      # só as variáveis deste serviço, nunca o .env inteiro
#       ANIMAIS_MONGO_URL: mongodb://${ANIMAIS_DB_USER}:${ANIMAIS_DB_PASSWORD}@mongo-animais:27017/animais?replicaSet=rs0&authSource=admin
#       ANIMAIS_AMQP_URL: amqp://animais:${RABBITMQ_ANIMAIS_PASSWORD}@rabbitmq:5672/
#     networks: [services, data-animais]
#     depends_on:
#       mongo-animais: { condition: service_healthy }
#       rabbitmq: { condition: service_healthy }
#     deploy: { resources: { limits: { memory: 256m } } }
#
# Cada serviço recebe por `environment:` só as variáveis dele: com `env_file: .env`, um
# serviço comprometido leria as senhas de todos os bancos.
#
# Só o gateway publica porta para fora (8000:8000). Serviços e bancos não usam `ports:`;
# a exceção é o painel do RabbitMQ, apenas em desenvolvimento.

name: ampara

services:
  postgres-identidade:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identidade
      POSTGRES_USER: ${IDENTIDADE_DB_USER:?defina no .env}
      POSTGRES_PASSWORD: ${IDENTIDADE_DB_PASSWORD:?defina no .env}
    volumes: [pg-identidade:/var/lib/postgresql/data]
    networks: [data-identidade]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d identidade"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  mongo-animais:
    build: ./infra/mongo
    image: ampara/mongo:dev
    hostname: mongo-animais
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${ANIMAIS_DB_USER:?defina no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${ANIMAIS_DB_PASSWORD:?defina no .env}
    volumes: [mongo-animais:/data/db]
    networks: [data-animais]
    healthcheck:
      # na primeira vez inicia o replica set; depois só confere se ele está de pé
      test:
        - CMD-SHELL
        - >-
          mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo-animais:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  postgres-adocao:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adocao
      POSTGRES_USER: ${ADOCAO_DB_USER:?defina no .env}
      POSTGRES_PASSWORD: ${ADOCAO_DB_PASSWORD:?defina no .env}
    volumes: [pg-adocao:/var/lib/postgresql/data]
    networks: [data-adocao]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d adocao"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  postgres-orquestrador:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orquestrador
      POSTGRES_USER: ${ORQUESTRADOR_DB_USER:?defina no .env}
      POSTGRES_PASSWORD: ${ORQUESTRADOR_DB_PASSWORD:?defina no .env}
    volumes: [pg-orquestrador:/var/lib/postgresql/data]
    networks: [data-orquestrador]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orquestrador"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  redis-notificacoes:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${NOTIFICACOES_REDIS_PASSWORD:?defina no .env}"]
    environment:
      REDISCLI_AUTH: ${NOTIFICACOES_REDIS_PASSWORD}
    volumes: [redis-notificacoes:/data]
    networks: [data-notificacoes]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  qdrant-assistente:
    image: qdrant/qdrant:v1.12.6
    volumes: [qdrant-assistente:/qdrant/storage]
    networks: [data-assistente]
    healthcheck:
      # a imagem não tem curl nem wget: o /readyz é consultado pelo /dev/tcp do bash
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 384m } } }
    restart: unless-stopped

  redis-assistente:
    # cache das respostas do LLM: sem volume, perder o cache não perde dado nenhum
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${ASSISTENTE_REDIS_PASSWORD:?defina no .env}"]
    environment:
      REDISCLI_AUTH: ${ASSISTENTE_REDIS_PASSWORD}
    networks: [data-assistente]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  rabbitmq:
    build: ./infra/rabbitmq
    image: ampara/rabbitmq:dev
    hostname: rabbitmq
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?defina no .env}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?defina no .env}
      RABBITMQ_ADOCAO_PASSWORD: ${RABBITMQ_ADOCAO_PASSWORD:?defina no .env}
      RABBITMQ_ANIMAIS_PASSWORD: ${RABBITMQ_ANIMAIS_PASSWORD:?defina no .env}
      RABBITMQ_IDENTIDADE_PASSWORD: ${RABBITMQ_IDENTIDADE_PASSWORD:?defina no .env}
      RABBITMQ_NOTIFICACOES_PASSWORD: ${RABBITMQ_NOTIFICACOES_PASSWORD:?defina no .env}
      RABBITMQ_ORQUESTRADOR_PASSWORD: ${RABBITMQ_ORQUESTRADOR_PASSWORD:?defina no .env}
      RABBITMQ_BFF_WEB_PASSWORD: ${RABBITMQ_BFF_WEB_PASSWORD:?defina no .env}
    ports: ["127.0.0.1:15672:15672"]   # painel, só em desenvolvimento e só nesta máquina
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [services]
    healthcheck:
      # só fica saudável depois que os usuários dos serviços foram criados
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && test -f /tmp/ampara-usuarios-prontos"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }
    restart: unless-stopped

  adocao:
    build: ./services/adocao
    image: ampara/adocao:dev
    environment:
      ADOCAO_DATABASE_URL: postgres://${ADOCAO_DB_USER}:${ADOCAO_DB_PASSWORD}@postgres-adocao:5432/adocao?sslmode=disable
      ADOCAO_AMQP_URL: amqp://adocao:${RABBITMQ_ADOCAO_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
    networks: [services, data-adocao]
    depends_on:
      postgres-adocao: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # a imagem distroless não tem curl: o próprio binário confere o /health
      test: ["CMD", "/adocao", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped


  # Orquestrador da SAGA (ADR-008): sem rota externa nem chamada HTTP de outro serviço;
  # tudo chega pelo RabbitMQ.
  orquestrador:
    build: ./services/orquestrador
    image: ampara/orquestrador:dev
    environment:
      ORQUESTRADOR_DATABASE_URL: postgres://${ORQUESTRADOR_DB_USER}:${ORQUESTRADOR_DB_PASSWORD}@postgres-orquestrador:5432/orquestrador?sslmode=disable
      ORQUESTRADOR_AMQP_URL: amqp://orquestrador:${RABBITMQ_ORQUESTRADOR_PASSWORD}@rabbitmq:5672/
      ORQUESTRADOR_TIMEOUT_PASSO: ${ORQUESTRADOR_TIMEOUT_PASSO:-10s}
      ORQUESTRADOR_PRAZO_EXPIRACAO: ${ORQUESTRADOR_PRAZO_EXPIRACAO:-72h}
      ORQUESTRADOR_MAX_REENVIOS_COMPENSACAO: ${ORQUESTRADOR_MAX_REENVIOS_COMPENSACAO:-10}
    networks: [services, data-orquestrador]
    depends_on:
      postgres-orquestrador: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # a imagem distroless não tem curl: o próprio binário confere o /health
      test: ["CMD", "/orquestrador", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped
  identidade:
    build: ./services/identidade
    image: ampara/identidade:dev
    environment:
      IDENTIDADE_DATABASE_URL: postgresql://${IDENTIDADE_DB_USER}:${IDENTIDADE_DB_PASSWORD}@postgres-identidade:5432/identidade
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?gere com scripts/gerar-chaves-jwt.sh}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
      JWT_ISSUER: ampara-identidade
      JWT_EXPIRACAO: 1h
      IDENTIDADE_AMQP_URL: amqp://identidade:${RABBITMQ_IDENTIDADE_PASSWORD}@rabbitmq:5672/
    # edge: o gateway encaminha /auth/v1 direto para a Identidade
    networks: [edge, services, data-identidade]
    depends_on:
      postgres-identidade: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  animais:
    build: ./services/animais
    image: ampara/animais:dev
    environment:
      ANIMAIS_MONGO_URL: mongodb://${ANIMAIS_DB_USER}:${ANIMAIS_DB_PASSWORD}@mongo-animais:27017/animais?replicaSet=rs0&authSource=admin
      ANIMAIS_LEITURA_MONGO_URL: mongodb://${ANIMAIS_DB_USER}:${ANIMAIS_DB_PASSWORD}@mongo-animais:27017/animais_leitura?replicaSet=rs0&authSource=admin
      ANIMAIS_AMQP_URL: amqp://animais:${RABBITMQ_ANIMAIS_PASSWORD}@rabbitmq:5672/
      # sem a chave, Animais aceitaria qualquer token sem conferir a assinatura
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
    networks: [services, data-animais]
    depends_on:
      mongo-animais: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }   # o outbox e os consumidores precisam do broker
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/ready\")' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  notificacoes:
    build: ./services/notificacoes
    image: ampara/notificacoes:dev
    environment:
      NOTIFICACOES_REDIS_URL: redis://:${NOTIFICACOES_REDIS_PASSWORD}@redis-notificacoes:6379/0
      NOTIFICACOES_AMQP_URL: amqp://notificacoes:${RABBITMQ_NOTIFICACOES_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
    networks: [services, data-notificacoes]
    depends_on:
      redis-notificacoes: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  assistente:
    build: ./services/assistente
    image: ampara/assistente:dev
    environment:
      QDRANT_URL: http://qdrant-assistente:6333
      ASSISTENTE_REDIS_URL: redis://:${ASSISTENTE_REDIS_PASSWORD}@redis-assistente:6379/0
      ANIMAIS_URL: http://animais:8001
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}            # vazia: o serviço sobe em modo degradado (#69)
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # chave pública RS256: o Assistente confere o JWT como os outros serviços
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
    networks: [services, data-assistente]
    depends_on:
      qdrant-assistente: { condition: service_healthy }
      redis-assistente: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    # o modelo de embeddings fica na memória (~800 MB com o runtime ONNX)
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  bff-web:
    build: ./bff/web
    image: ampara/bff-web:dev
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
      IDENTIDADE_URL: http://identidade:3001
      ANIMAIS_URL: http://animais:8001
      ADOCAO_URL: http://adocao:8080
      # eventos em tempo real para o painel (GET /web/v1/eventos)
      BFF_WEB_AMQP_URL: amqp://bff-web:${RABBITMQ_BFF_WEB_PASSWORD}@rabbitmq:5672/
    networks: [edge, services]
    depends_on:
      identidade: { condition: service_healthy }
      adocao: { condition: service_healthy }
      animais: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/web/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  bff-mobile:
    build: ./bff/mobile
    image: ampara/bff-mobile:dev
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
      IDENTIDADE_URL: http://identidade:3001
      ANIMAIS_URL: http://animais:8001
      ADOCAO_URL: http://adocao:8080
      NOTIFICACOES_URL: http://notificacoes:8002
      ASSISTENTE_URL: http://assistente:8003
    networks: [edge, services]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: ampara/gateway:dev
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?gere com scripts/gerar-chaves-jwt.sh}
    ports: ["8000:8000"]
    networks: [edge]
    depends_on:
      identidade: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kong health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

networks:
  edge: {}
  services: {}
  data-identidade: { internal: true }
  data-animais: { internal: true }
  data-adocao: { internal: true }
  data-orquestrador: { internal: true }
  data-notificacoes: { internal: true }
  data-assistente: { internal: true }

volumes:
  pg-identidade: {}
  mongo-animais: {}
  pg-adocao: {}
  pg-orquestrador: {}
  redis-notificacoes: {}
  qdrant-assistente: {}
  rabbitmq-data: {}
