  schemas:
    Estado:
      type: string
      enum:
        - SOLICITADA
        - ANIMAL_RESERVADO
        - AGUARDANDO_APROVACAO
        - APROVADA
        - COMPENSANDO
        - CONCLUIDA
        - REJEITADA_INDISPONIVEL
        - PERFIL_INVALIDO
        - RECUSADA
        - CANCELADA
        - EXPIRADA
        - FALHOU
    Desfecho:
      type: string
      description: Estado final que será gravado quando as compensações terminarem.
      enum: [PERFIL_INVALIDO, RECUSADA, CANCELADA, EXPIRADA, FALHOU]
    AnimalId:
      type: string
      description: Identificador do animal no serviço Animais (ObjectId do MongoDB).
      pattern: '^[0-9a-f]{24}$'
    NovaSolicitacao:
      type: object
      additionalProperties: false
      required: [animalId]
      properties:
        animalId:
          $ref: '#/components/schemas/AnimalId'
    Recusa:
      type: object
      additionalProperties: false
      properties:
        motivo:
          type: string
          maxLength: 500
    Link:
      type: object
      additionalProperties: false
      required: [href]
      properties:
        href:
          type: string
          format: uri-reference
        method:
          type: string
          description: Omitido para navegação (GET); POST nas ações.
          enum: [POST]
    LinksSolicitacao:
      type: object
      description: >-
        self, animal e historico estão sempre presentes. aprovar e recusar só
        aparecem para o responsável em AGUARDANDO_APROVACAO; cancelar, só para
        o adotante nesse mesmo estado.
      additionalProperties: false
      required: [self, animal, historico]
      properties:
        self:
          $ref: '#/components/schemas/Link'
        animal:
          $ref: '#/components/schemas/Link'
        historico:
          $ref: '#/components/schemas/Link'
        aprovar:
          $ref: '#/components/schemas/Link'
        recusar:
          $ref: '#/components/schemas/Link'
        cancelar:
          $ref: '#/components/schemas/Link'
    Solicitacao:
      type: object
      additionalProperties: false
      required:
        - id
        - estado
        - desfecho
        - motivo
        - animalId
        - animalNome
        - adotanteId
        - responsavelId
        - expiraEm
        - criadoEm
        - atualizadoEm
        - _links
      properties:
        id:
          type: string
          format: uuid
          description: Igual ao sagaId.
        estado:
          $ref: '#/components/schemas/Estado'
        desfecho:
          description: Preenchido a partir de COMPENSANDO; null nos demais casos.
          oneOf:
            - $ref: '#/components/schemas/Desfecho'
            - type: 'null'
        motivo:
          type: [string, 'null']
          description: Motivo da recusa, quando informado pelo responsável.
        animalId:
          $ref: '#/components/schemas/AnimalId'
        animalNome:
          type: [string, 'null']
          description: Cópia vinda de AnimalReservado; null antes da reserva.
        adotanteId:
          type: string
          format: uuid
        responsavelId:
          type: [string, 'null']
          format: uuid
          description: Vem de AnimalReservado; null antes da reserva.
        expiraEm:
          type: [string, 'null']
          format: date-time
          description: >-
            Gravado ao entrar em AGUARDANDO_APROVACAO, a partir de
            ADOCAO_PRAZO_EXPIRACAO (72 h em produção, 2 min na demo).
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/LinksSolicitacao'
    PaginaSolicitacoes:
      type: object
      additionalProperties: false
      required: [_embedded, _links]
      properties:
        _embedded:
          type: object
          additionalProperties: false
          required: [solicitacoes]
          properties:
            solicitacoes:
              type: array
              items:
                $ref: '#/components/schemas/Solicitacao'
        _links:
          type: object
          additionalProperties: false
          required: [self]
          properties:
            self:
              $ref: '#/components/schemas/Link'
            next:
              $ref: '#/components/schemas/Link'
    Resumo:
      type: object
      additionalProperties: false
      required: [porEstado, ativasPorAnimal, concluidasNoMes]
      properties:
        porEstado:
          type: object
          description: Quantidade por estado; estados sem solicitação são omitidos.
          propertyNames:
            $ref: '#/components/schemas/Estado'
          additionalProperties:
            type: integer
            minimum: 1
        ativasPorAnimal:
          type: object
          description: Solicitações em estado ativo, por animalId.
          propertyNames:
            $ref: '#/components/schemas/AnimalId'
          additionalProperties:
            type: integer
            minimum: 1
        concluidasNoMes:
          type: integer
          minimum: 0
    ItemHistorico:
      type: object
      additionalProperties: false
      required: [de, para, evento, passo, em]
      properties:
        de:
          description: Estado anterior; null na criação.
          oneOf:
            - $ref: '#/components/schemas/Estado'
            - type: 'null'
        para:
          $ref: '#/components/schemas/Estado'
        evento:
          type: string
          description: Gatilho da transição (resposta, ação ou timeout).
        passo:
          type: [string, 'null']
          description: >-
            Passo da SAGA cuja resposta ou timeout disparou a transição; null
            na criação e nas ações (aprovar, recusar, cancelar, expirar).
          enum: [T1, T2, T4, T5, C1, C2, null]
        em:
          type: string
          format: date-time
    Historico:
      type: object
      additionalProperties: false
      required: [itens, _links]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemHistorico'
        _links:
          type: object
          additionalProperties: false
          required: [self, solicitacao]
          properties:
            self:
              $ref: '#/components/schemas/Link'
            solicitacao:
              $ref: '#/components/schemas/Link'
    Problema:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
