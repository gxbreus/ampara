apiVersion: apps/v1
kind: Deployment
metadata: { name: animais, labels: { app: animais } }
spec:
  replicas: 2
  selector: { matchLabels: { app: animais } }
  template:
    metadata: { labels: { app: animais } }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: animais } }
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: animais
          image: ampara/animais:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: animais-config }
            - configMapRef: { name: animais-jwt }
          env:
            - name: ANIMAIS_MONGO_URL
              valueFrom: { secretKeyRef: { name: animais-secret, key: ANIMAIS_MONGO_URL } }
            - name: ANIMAIS_LEITURA_MONGO_URL
              valueFrom: { secretKeyRef: { name: animais-secret, key: ANIMAIS_LEITURA_MONGO_URL } }
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: animais-secret, key: RABBITMQ_URL } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
