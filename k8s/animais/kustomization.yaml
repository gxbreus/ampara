apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ampara
resources: [deployment.yaml, service.yaml, configmap.yaml, mongo-statefulset.yaml]
secretGenerator:
  - name: animais-secret
    envs: [secret.env]
configMapGenerator:
  - name: animais-jwt
    files: [JWT_PUBLIC_KEY=jwt.pub]
generatorOptions:
  disableNameSuffixHash: true
