# Configuração que não é segredo, com os mesmos nomes do .env.example. Para trocar o modelo,
# edite aqui e reinicie: kubectl rollout restart deploy/assistente -n ampara
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistente-config
data:
  QDRANT_URL: http://qdrant-assistente:6333
  ANIMAIS_URL: http://animais:8001
  # groq, ou openai para APIs compatíveis com a da OpenAI (Gemini: LLM_BASE_URL vazio)
  LLM_PROVIDER: openai
  LLM_BASE_URL: ""
  # flash-lite é o de menor custo. Só Gemini 2.x: os 3.x recusam a segunda etapa da conversa
  # com ferramenta (recomendação). A cota extra vem da Groq e do OpenRouter (docs/llm/provedores.md)
  LLM_MODEL: gemini-2.5-flash-lite
  LLM_FALLBACK_MODEL: gemini-2.5-flash
