# O Assistente não guarda estado no pod: os vetores ficam no Qdrant e o cache no Redis, então
# qualquer réplica atende qualquer pergunta. Fica com 1 réplica porque cada pod carrega o
# modelo de embeddings na memória (~800 MB); para escalar: kubectl scale deploy/assistente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistente
  labels: { app: assistente }
spec:
  replicas: 1
  selector:
    matchLabels: { app: assistente }
  template:
    metadata:
      labels: { app: assistente }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: assistente }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # appuser da imagem
      containers:
        - name: assistente
          image: ampara/assistente:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8003 }
          envFrom:
            - configMapRef: { name: assistente-config }
          # só as chaves do serviço; REDIS_PASSWORD fica com o Redis
          env:
            - name: ASSISTENTE_REDIS_URL
              valueFrom: { secretKeyRef: { name: assistente-secret, key: ASSISTENTE_REDIS_URL } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: assistente-secret, key: LLM_API_KEY } }
            # reservas gratuitas de outros provedores (opcionais)
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: assistente-secret, key: GROQ_API_KEY, optional: true }
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: assistente-secret, key: OPENROUTER_API_KEY, optional: true }
            - name: JWT_PUBLIC_KEY
              valueFrom: { configMapKeyRef: { name: assistente-jwt, key: JWT_PUBLIC_KEY } }
          # readiness: Qdrant e Redis no ar. O provedor de LLM nunca entra em probe: fora do
          # ar, o serviço usa o fallback (#69). A subida carrega o modelo de embeddings (~20 s).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # o onnxruntime precisa de um /tmp gravável; o resto do disco continua só leitura
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1Gi }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
