apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ampara
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - qdrant-statefulset.yaml
  - redis-deployment.yaml
secretGenerator:
  - name: assistente-secret
    envs: [secret.env]
generatorOptions:
  disableNameSuffixHash: true
