# Cache das respostas do LLM. É Deployment, sem volume, de propósito: perder o cache não
# perde dado nenhum, só deixa as próximas perguntas mais lentas.
apiVersion: v1
kind: Service
metadata:
  name: redis-assistente
  labels: { app: redis-assistente }
spec:
  selector: { app: redis-assistente }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-assistente
  labels: { app: redis-assistente }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-assistente }
  template:
    metadata:
      labels: { app: redis-assistente }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: assistente-secret, key: REDIS_PASSWORD } }
            - name: REDISCLI_AUTH        # o redis-cli das probes lê a senha daqui
              valueFrom: { secretKeyRef: { name: assistente-secret, key: REDIS_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
