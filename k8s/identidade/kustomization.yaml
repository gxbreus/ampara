apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ampara
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - postgres-statefulset.yaml
secretGenerator:
  - name: identidade-secret
    envs: [secret.env]
    files:
      - JWT_PRIVATE_KEY=jwt.key
  - name: identidade-jwt-publico
    files:
      - JWT_PUBLIC_KEY=jwt.pub
generatorOptions:
  disableNameSuffixHash: true
