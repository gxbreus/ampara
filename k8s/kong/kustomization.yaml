apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ampara
resources:
  - plugins.yaml
  - consumer.yaml
secretGenerator:
  - name: jwt-identidade
    files:
      - rsa_public_key=jwt.pub
    literals:
      - key=ampara-identidade
      - algorithm=RS256
    options:
      labels:
        konghq.com/credential: jwt
generatorOptions:
  disableNameSuffixHash: true
