apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: jwt
plugin: jwt
config:
  key_claim_name: iss
  claims_to_verify: [exp]
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-auth
plugin: rate-limiting
config: { minute: 20, policy: local }
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-mobile
plugin: rate-limiting
config: { minute: 600, policy: local }
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-web
plugin: rate-limiting
config: { minute: 300, policy: local }
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: correlation-id
  labels: { global: "true" }
plugin: correlation-id
config: { header_name: X-Correlation-Id, generator: uuid, echo_downstream: true }
---
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: cors
  labels: { global: "true" }
plugin: cors
config:
  origins: [http://localhost:5173]
  methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  headers: [Authorization, Content-Type, X-Correlation-Id]
  exposed_headers: [X-Correlation-Id]
  credentials: false
