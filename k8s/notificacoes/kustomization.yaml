apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ampara
resources:
  - deployment.yaml
  - service.yaml
  - redis-statefulset.yaml
configMapGenerator:
  - name: notificacoes-jwt
    files: [JWT_PUBLIC_KEY=jwt.pub]
secretGenerator:
  - name: notificacoes-secret
    envs: [secret.env]
generatorOptions:
  disableNameSuffixHash: true
