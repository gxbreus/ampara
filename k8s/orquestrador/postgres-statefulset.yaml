apiVersion: v1
kind: Service
metadata:
  name: postgres-orquestrador
  labels: { app: postgres-orquestrador }
spec:
  clusterIP: None          # headless: o StatefulSet tem identidade de rede estável
  selector: { app: postgres-orquestrador }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-orquestrador
  labels: { app: postgres-orquestrador }
spec:
  serviceName: postgres-orquestrador
  replicas: 1
  selector:
    matchLabels: { app: postgres-orquestrador }
  template:
    metadata:
      labels: { app: postgres-orquestrador }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: orquestrador }
            # o volume do kind cria lost+found, e o Postgres recusa um diretório não vazio
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: orquestrador-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: orquestrador-secret, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d orquestrador"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d orquestrador"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: dados, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
